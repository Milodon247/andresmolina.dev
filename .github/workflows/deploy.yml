# Production: every push to main runs the full quality gate, deploys the exact tested build to
# Cloudflare and smoke-tests the live site. A failed smoke test turns the run red and prints the
# rollback command (see rollback.yml and the README).
name: Deploy

on:
  push:
    branches: [main]

permissions: {}

# Lives in the repo (not a GitHub variable) so it changes in the same commit as the custom domain
# in wrangler.jsonc.
env:
  PRODUCTION_URL: https://andresmolina.dev

# Pushes to main are queued, never cancelled, so every merged commit reaches production in order.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: $/.github/workflows/checks.yml
    permissions:
      contents: read

  deploy:
    name: Deploy to production
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    # Shared with rollback.yml: never two production changes at once, never cancel one midway.
    concurrency:
      group: production
      cancel-in-progress: false
    outputs:
      previous-version: ${{ steps.previous.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Download tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Record the version currently in production
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        # The first deployment has no previous version.
        run: |
          version="$(npx wrangler deployments status --json 2>/dev/null | jq -r '.versions[0].version_id // empty' || true)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Previous production version: ${version:-none}"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        # --strict refuses to deploy over changes made outside this pipeline (e.g. in the dashboard).
        run: npx wrangler deploy --strict --tag "${GITHUB_SHA::12}" --message "main @ ${GITHUB_SHA}"

  smoke:
    name: Smoke tests (production)
    needs: deploy
    runs-on: ubuntu-24.04
    container:
      # Official Playwright image: browsers and their system libraries preinstalled, so no apt-get.
      # Keep the version equal to @playwright/test (enforced by tests/repo/playwright-image.test.ts).
      image: mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579 # v1.65.1-noble
      options: --ipc=host
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # --ignore-scripts: the git hooks installed by `prepare` are not needed in CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # A new custom domain needs a few minutes for its DNS record and certificate.
      - name: Wait for production to answer
        run: node scripts/wait-for-site.ts "$PRODUCTION_URL" 600

      - name: Run smoke tests against production
        env:
          BASE_URL: ${{ env.PRODUCTION_URL }}
        run: npm run test:smoke

      - name: Explain how to roll back
        if: failure()
        env:
          PREVIOUS_VERSION: ${{ needs.deploy.outputs.previous-version }}
        run: |
          {
            echo "## Production smoke tests failed"
            echo
            if [ -n "$PREVIOUS_VERSION" ]; then
              echo "Roll back to the previous version: **Actions → Rollback → Run workflow** with"
              echo "\`version_id\` = \`${PREVIOUS_VERSION}\` and a reason."
            else
              echo "This was the first deployment: there is no previous version to roll back to."
            fi
            echo
            echo "Rollback restores code only. If **Wait for production to answer** failed, or a test"
            echo "mentions \`/cdn-cgi/\` or an unexpected header, the cause is the domain or a zone"
            echo "setting: follow the README section *Rollback* instead."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report-production
          path: |
            playwright-report/
            test-results/
          retention-days: 7
