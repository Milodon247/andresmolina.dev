# Pull requests: full quality gate, dependency review, then a Cloudflare Preview of the exact tested
# build with smoke tests against its real URL. PRs from forks run the checks but never get secrets.
name: Pull request

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: $/.github/workflows/checks.yml
    permissions:
      contents: read

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  preview:
    name: Deploy preview
    needs: [checks, dependency-review]
    # Forks never get secrets. Dependabot PRs don't receive Actions secrets either: they rely on
    # the full checks here and on the production smoke tests after merge.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Download tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create or update the Cloudflare Preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # wrangler appends structured results (one JSON object per line) to this file;
          # stdout is human-readable text.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          npx wrangler preview --name "pr-${PR_NUMBER}" --ignore-base-config \
            --message "PR #${PR_NUMBER} @ ${HEAD_SHA}"
          url="$(jq -ers 'map(select(.type == "preview")) | last | .preview_urls[0]' "$WRANGLER_OUTPUT_FILE_PATH")"
          [[ "$url" =~ ^https://[a-z0-9.-]+\.workers\.dev$ ]] || { echo "Unexpected preview URL: $url"; exit 1; }
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "### Preview: ${url}" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke tests (preview)
    needs: preview
    runs-on: ubuntu-24.04
    container:
      # Official Playwright image: browsers and their system libraries preinstalled, so no apt-get.
      # Keep the version equal to @playwright/test (enforced by tests/repo/playwright-image.test.ts).
      image: mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579 # v1.65.1-noble
      options: --ipc=host
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # --ignore-scripts: the git hooks installed by `prepare` are not needed in CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run smoke tests against the preview URL
        env:
          BASE_URL: ${{ needs.preview.outputs.url }}
        run: npm run test:smoke

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report-preview
          path: |
            playwright-report/
            test-results/
          retention-days: 7
